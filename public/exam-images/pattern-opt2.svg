<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100px" height="100px">
  <style>
    .frame { fill: none; stroke: #94a3b8; stroke-width: 2; rx: 8; }
    .arrow { fill: #3b82f6; stroke: #2563eb; stroke-width: 1; }
    .dot { fill: #ef4444; }
  </style>
  <rect x="0" y="0" width="100" height="100" class="frame" />
  <g transform="rotate(270, 50, 50)">
    <path d="M50,20 L30,50 L40,50 L40,80 L60,80 L60,50 L70,50 Z" class="arrow" />
  </g>
  <circle cx="20" cy="20" r="6" class="dot" />
  <circle cx="80" cy="20" r="6" class="dot" />
  <circle cx="20" cy="80" r="6" class="dot" />
</svg>
