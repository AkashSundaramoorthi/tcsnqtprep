<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="300px">
  <style>
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; stroke-linejoin: round; }
    .text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
  </style>
  
  <g transform="translate(100, 50)">
    <!-- 1 (Top) -->
    <rect x="50" y="0" width="50" height="50" class="box" />
    <text x="75" y="25" class="text">1</text>
    
    <!-- 2 (Left), 3 (Center), 4 (Right) -->
    <rect x="0" y="50" width="50" height="50" class="box" />
    <text x="25" y="75" class="text">2</text>
    <rect x="50" y="50" width="50" height="50" class="box" />
    <text x="75" y="75" class="text">3</text>
    <rect x="100" y="50" width="50" height="50" class="box" />
    <text x="125" y="75" class="text">4</text>
    
    <!-- 5 (Bottom) -->
    <rect x="50" y="100" width="50" height="50" class="box" />
    <text x="75" y="125" class="text">5</text>

    <!-- 6 (Far Bottom) -->
    <rect x="50" y="150" width="50" height="50" class="box" />
    <text x="75" y="175" class="text">6</text>
  </g>
</svg>
